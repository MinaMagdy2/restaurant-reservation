<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Golden Beach Resort</title>

    <base href="/Golden-Beach/" />

    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="GoldenBeach.styles.css" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <head-outlet />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        window.initMobileSequentialReveal = function () {
            if (window.innerWidth > 767) return;
            const cards = document.querySelectorAll('.mobile-stack .col-12');
            window.addEventListener('scroll', () => {
                cards.forEach((card) => {
                    const cardTop = card.getBoundingClientRect().top;
                    const cardHeight = card.offsetHeight;
                    if (cardTop < -(cardHeight * 0.25)) {
                        card.classList.add('is-faded');
                    }
                    else if (cardTop < window.innerHeight * 0.8) {
                        card.classList.remove('is-faded');
                    }
                });
            });
        };

        window.startTestimonialsCarousel = function () {
            var myCarousel = document.getElementById('testimonialsCarousel');
            if (myCarousel) {
                var carousel = bootstrap.Carousel.getOrCreateInstance(myCarousel, {
                    interval: 4000,
                    ride: 'carousel',
                    pause: 'hover'
                });
                carousel.cycle();
                console.log("Carousel Started Successfully!");
            } else {
                console.log("Carousel element not found!");
            }
        };

        window.initScrollAnimations = () => {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('animate__animated', 'animate__fadeInUp');
                        entry.target.style.opacity = '1';
                        observer.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.15 });

            document.querySelectorAll('.reveal-on-scroll').forEach(el => {
                observer.observe(el);
            });
        };
    </script>
</body>

</html>
